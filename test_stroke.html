<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>빚 - 획 애니메이션 테스트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #f5edd8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* =============================================
       획 SVG 컨테이너
       ✏️ [수정] width/height로 전체 크기 조절
       ============================================= */
    .stroke-wrap {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .stroke-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* =============================================
       공통 - 기본 숨김 상태
       ============================================= */
    .hok {
      opacity: 0;
    }

    /* =============================================
       위 → 아래 (세로획: 획1, 획3, 획4)
       ✏️ [수정] 속도: animation duration 조절
       ============================================= */
    .hok-top-down {
  animation: topDown 0.7s ease forwards;
}

    @keyframes topDown {
      0%   { opacity: 1; clip-path: inset(0 0 100% 0); }
      100% { opacity: 1; clip-path: inset(0 0 0% 0); }
    }

    /* =============================================
       왼 → 오른 (가로/대각선획: 획2, 획5, 획6, 획7)
       ✏️ [수정] 속도: animation duration 조절
       ============================================= */
.hok-left-right {
  animation: leftRight 0.7s ease forwards;
}

    @keyframes leftRight {
      0%   { opacity: 1; clip-path: inset(0 100% 0 0); }
      100% { opacity: 1; clip-path: inset(0 0% 0 0); }
    }

    /* =============================================
       ✏️ [수정] 획별 딜레이 (0.4s 간격)
       ============================================= */
/* 획 하나 끝나면 바로 다음 획 시작 (0.7s + 0.1s 여유) */
.hok-1 { animation-delay: 0.3s; }
.hok-2 { animation-delay: 1.1s; }
.hok-3 { animation-delay: 1.9s; }
.hok-4 { animation-delay: 2.7s; }
.hok-5 { animation-delay: 3.5s; }
.hok-6 { animation-delay: 4.3s; }
.hok-7 { animation-delay: 5.1s; }

  </style>
</head>
<body>

  <div class="stroke-wrap">
    <!-- 획1: ㅂ 왼쪽 세로획 → 위에서 아래로 -->
    <img class="hok hok-top-down hok-1" src="획1.svg" alt="획1" />
    <!-- 획2: ㅂ 가로획 → 왼쪽에서 오른쪽으로 -->
    <img class="hok hok-left-right hok-2" src="획2.svg" alt="획2" />
    <!-- 획3: ㅂ 오른쪽 세로획 → 위에서 아래로 -->
    <img class="hok hok-top-down hok-3" src="획3.svg" alt="획3" />
    <!-- 획4: ㅣ 세로획 → 위에서 아래로 -->
    <img class="hok hok-top-down hok-4" src="획4.svg" alt="획4" />
    <!-- 획5: ㅈ 왼쪽 대각선 → 왼쪽에서 오른쪽으로 -->
    <img class="hok hok-left-right hok-5" src="획5.svg" alt="획5" />
    <!-- 획6: ㅈ 가로획 → 왼쪽에서 오른쪽으로 -->
    <img class="hok hok-left-right hok-6" src="획6.svg" alt="획6" />
    <!-- 획7: ㅈ 오른쪽 대각선 → 왼쪽에서 오른쪽으로 -->
    <img class="hok hok-left-right hok-7" src="획7.svg" alt="획7" />
  </div>

    <!-- 획4: ㅣ 세로획 → 위에서 아래로 -->

    <!-- 획5: ㅈ 왼쪽 대각선 → 왼쪽에서 오른쪽으로 -->
    <img class="hok hok-left-right hok-5" src="획5.svg" alt="획5" />
    <!-- 획6: ㅈ 가로획 → 왼쪽에서 오른쪽으로 -->

    <!-- 획7: ㅈ 오른쪽 대각선 → 왼쪽에서 오른쪽으로 -->

</body>
